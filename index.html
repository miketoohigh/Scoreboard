<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>Jumbotron Scoreboard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Big+Shoulders+Text:wght@500;600;700&display=swap">
<style>
/* One idea: the two teams' colours flood the whole screen, split on a diagonal seam, like an arena video board.
   Everything else (clock plate, stat slab, game strip) is dark glass so the colour and the scores stay the focus.
   All sizes derive from --u, which is 1/108 of the screen height or 1/192 of its width, whichever is smaller. */
:root{
  --board:#060912; --plate:rgba(5,8,18,.82); --plate2:rgba(5,8,18,.6); --hair:rgba(255,255,255,.2);
  --white:#f7f9ff; --mute:rgba(247,249,255,.7); --live:#ff2d3d; --gold:#ffc61a;
  --ca:#1565d8; --ca-hi:#3a85ee; --ca-lo:#0a2f6b; --cb:#e0382a; --cb-hi:#f0604f; --cb-lo:#6b1a12;
  --u:min(calc(100vw / 192), calc(100vh / 108));
  --disp:"Big Shoulders Display","Oswald","Arial Narrow",Impact,sans-serif;
  --text:"Big Shoulders Text","Arial Narrow","Roboto Condensed",sans-serif;
  --s-score:36; --s-nick:9; --s-city:3.2; --s-rec:3; --s-time:15; --s-per:3.4; --s-ls:2.6; --s-ctx:3.2; --slab:39;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--board)}
body{color:var(--white);font:600 calc(var(--u)*2.6)/1.15 var(--text);overflow:hidden}
body.idle{cursor:none}
[hidden]{display:none!important}
button,select{font:inherit}

/* ---- colour field ---- */
.field{position:fixed;inset:0;z-index:0;overflow:hidden;background:var(--board)}
.fa,.fb,.seam{position:absolute;inset:0}
.fa{background:linear-gradient(165deg,var(--ca-hi),var(--ca) 42%,var(--ca-lo));clip-path:polygon(0 0,57% 0,43% 100%,0 100%)}
.fb{background:linear-gradient(195deg,var(--cb-hi),var(--cb) 42%,var(--cb-lo));clip-path:polygon(57% 0,100% 0,100% 100%,43% 100%)}
.seam{background:#fff;opacity:.9;clip-path:polygon(56.75% 0,57.25% 0,43.25% 100%,42.75% 100%);filter:drop-shadow(0 0 calc(var(--u)*.8) rgba(255,255,255,.8))}
.sheen{position:absolute;inset:0;background:radial-gradient(120% 55% at 50% -8%,rgba(255,255,255,.2),transparent 62%),radial-gradient(100% 70% at 50% 115%,rgba(0,0,0,.55),transparent 65%)}
.px{position:absolute;inset:0;opacity:.07;background-image:linear-gradient(#000 1px,transparent 1px),linear-gradient(90deg,#000 1px,transparent 1px);background-size:calc(var(--u)*.55) calc(var(--u)*.55)}
.field.lose-a .fa,.field.lose-h .fb{filter:saturate(.45) brightness(.7)}

/* ---- layout ---- */
.stage{position:relative;z-index:1;height:100%;box-sizing:border-box;display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;
  gap:calc(var(--u)*1.2);padding:calc(var(--u)*1.6) calc(var(--u)*2.4)}
.stage.nostats{grid-template-rows:auto minmax(0,1fr) auto}
.stage.nostats .slab{display:none}

.top{display:flex;align-items:center;gap:calc(var(--u)*2.2);min-height:calc(var(--u)*5)}
.lg{font:900 calc(var(--u)*3.4)/1 var(--disp);color:#0a0e1a;background:var(--white);padding:calc(var(--u)*.8) calc(var(--u)*2) calc(var(--u)*.8) calc(var(--u)*1.6);
  clip-path:polygon(0 0,100% 0,calc(100% - var(--u)*1) 100%,0 100%)}
.where{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 calc(var(--u)*2.4);flex:1;min-width:0;font:700 calc(var(--u)*2.6)/1.15 var(--text);text-shadow:0 1px 6px rgba(0,0,0,.5)}
.where span:empty{display:none}
.where .note{color:var(--gold)}
.live{display:inline-flex;align-items:center;gap:calc(var(--u)*.8);background:var(--live);color:#fff;font:900 calc(var(--u)*2.8)/1 var(--disp);padding:calc(var(--u)*.7) calc(var(--u)*1.5)}
.live i{width:calc(var(--u)*1.1);height:calc(var(--u)*1.1);border-radius:50%;background:#fff;animation:blink 1.4s ease-in-out infinite}
.tag{font:900 calc(var(--u)*2.6)/1 var(--disp);padding:calc(var(--u)*.7) calc(var(--u)*1.4);background:var(--gold);color:#1a1200}
.tag.off{background:#fff;color:#7a0010}
.clk{font:800 calc(var(--u)*3.2)/1 var(--disp);text-shadow:0 1px 6px rgba(0,0,0,.5)}

.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(calc(var(--u)*38),calc(var(--u)*44)) minmax(0,1fr);align-items:center;min-height:0}
.side{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;text-align:center;text-shadow:0 2px 14px rgba(0,0,0,.45)}
.side>*{transform:skewX(-6deg)}
.tx{display:flex;flex-direction:column;align-items:center;min-width:0;max-width:100%}
.city{font:700 calc(var(--u)*var(--s-city))/1 var(--disp);opacity:.9}
.nick{font:900 calc(var(--u)*var(--s-nick)*var(--f,1))/.95 var(--disp);text-transform:uppercase;white-space:nowrap;max-width:100%}
.rec{font:700 calc(var(--u)*var(--s-rec))/1.1 var(--text);opacity:.92;margin-top:calc(var(--u)*.3)}
.score{position:relative;font:900 calc(var(--u)*var(--s-score)*var(--sf,1))/.82 var(--disp);font-variant-numeric:tabular-nums;margin-top:calc(var(--u)*1)}
.ball{display:inline-block;vertical-align:middle;width:calc(var(--u)*3.2);height:calc(var(--u)*1.9);margin-right:calc(var(--u)*1);border-radius:50%/60%;background:var(--gold);box-shadow:inset 0 0 0 calc(var(--u)*.25) rgba(0,0,0,.35)}
.delta{position:absolute;left:100%;top:8%;font:900 calc(var(--u)*7)/1 var(--disp);color:var(--gold);transform:skewX(6deg);animation:rise 2.6s ease-out both;text-shadow:0 2px 12px rgba(0,0,0,.6);pointer-events:none}
.side.lose .score{opacity:.72}
.side.pop .score{animation:pop 1.1s steps(2,jump-none) 5}

.plate{align-self:center;background:var(--plate);backdrop-filter:blur(calc(var(--u)*.6));text-align:center;
  padding:calc(var(--u)*1.6) calc(var(--u)*1.8) calc(var(--u)*1.8);border-top:calc(var(--u)*.5) solid var(--white);
  clip-path:polygon(0 0,100% 0,100% calc(100% - var(--u)*2),calc(100% - var(--u)*2) 100%,calc(var(--u)*2) 100%,0 calc(100% - var(--u)*2))}
.per{font:800 calc(var(--u)*var(--s-per))/1 var(--disp);color:var(--mute);text-transform:uppercase;min-height:calc(var(--u)*var(--s-per))}
.time{font:900 calc(var(--u)*var(--s-time))/.95 var(--disp);font-variant-numeric:tabular-nums;white-space:nowrap}
.time.sm{font-size:calc(var(--u)*var(--s-time)*.7)}
.plate.lv .time{color:#fff}
.ctx{margin-top:calc(var(--u)*.8);font:700 calc(var(--u)*var(--s-ctx))/1.15 var(--text);min-height:calc(var(--u)*var(--s-ctx))}
.ctx b{font:900 calc(var(--u)*var(--s-ctx)*1.3)/1 var(--disp);color:var(--gold)}
.ctx .rz{background:var(--gold);color:#1a1200;font:900 calc(var(--u)*2.4)/1 var(--disp);padding:calc(var(--u)*.3) calc(var(--u)*.8);margin-left:calc(var(--u)*.8)}
.ctx.play{font-weight:600;color:var(--mute);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dia{display:flex;align-items:center;justify-content:center;gap:calc(var(--u)*2.4);margin-top:calc(var(--u)*.6)}
.dia svg{width:calc(var(--u)*13);height:auto}
.dia .base{fill:rgba(255,255,255,.14);stroke:rgba(255,255,255,.55);stroke-width:2}
.dia .base.on{fill:var(--gold);stroke:var(--gold)}
.dia .cnt{font:900 calc(var(--u)*7)/1 var(--disp);text-align:left}
.dia .cnt small{display:block;font:700 calc(var(--u)*2.4)/1.2 var(--text);color:var(--mute)}
.dia .out{display:inline-block;width:calc(var(--u)*1.4);height:calc(var(--u)*1.4);border-radius:50%;border:2px solid var(--mute);margin-right:calc(var(--u)*.6)}
.dia .out.on{background:var(--gold);border-color:var(--gold)}

table.ls{border-collapse:collapse;margin:calc(var(--u)*1.2) auto 0;font:700 calc(var(--u)*var(--s-ls))/1.1 var(--text);font-variant-numeric:tabular-nums}
table.ls th{color:var(--mute);font-weight:600;padding:calc(var(--u)*.3) calc(var(--u)*.75);text-align:center}
table.ls td{padding:calc(var(--u)*.35) calc(var(--u)*.75);text-align:center;border-top:1px solid var(--hair)}
table.ls td:first-child,table.ls th:first-child{text-align:left;padding-left:0}
table.ls td:first-child{font:900 calc(var(--u)*var(--s-ls)*1.15)/1 var(--disp)}
table.ls td:first-child i{display:inline-block;width:calc(var(--u)*.7);height:calc(var(--u)*2.2);margin-right:calc(var(--u)*.8);vertical-align:middle;background:var(--tc)}
table.ls .tot{font-weight:800;color:#fff}
table.ls .cur{color:var(--gold)}
table.ls .dim{color:var(--mute)}

/* ---- stat slab ---- */
.slab{display:grid;grid-template-rows:auto minmax(0,1fr);height:calc(var(--u)*var(--slab));background:var(--plate);backdrop-filter:blur(calc(var(--u)*.6));
  clip-path:polygon(0 0,100% 0,100% calc(100% - var(--u)*2.4),calc(100% - var(--u)*2.4) 100%,calc(var(--u)*2.4) 100%,0 calc(100% - var(--u)*2.4))}
.slabhead{position:relative;display:flex;align-items:center;gap:calc(var(--u)*2);padding:calc(var(--u)*.9) calc(var(--u)*2.4);border-bottom:1px solid var(--hair)}
.vt{font:900 calc(var(--u)*3.4)/1 var(--disp);text-transform:uppercase}
.vd{display:flex;gap:calc(var(--u)*.5)}
.vd i{width:calc(var(--u)*1.2);height:calc(var(--u)*.7);background:rgba(255,255,255,.28)}
.vd i.on{width:calc(var(--u)*3.2);background:var(--gold)}
.prog{position:absolute;left:0;right:0;bottom:-1px;height:calc(var(--u)*.35);overflow:hidden}
.prog i{display:block;height:100%;background:var(--gold);transform-origin:left;transform:scaleX(0)}
.prog i.run{animation:fill linear forwards}
.slabbody{padding:calc(var(--u)*1) calc(var(--u)*2.4) calc(var(--u)*2);min-height:0;overflow:hidden;transition:opacity .25s ease}
.slabbody.out{opacity:0}

.cmp{display:flex;flex-direction:column;gap:calc(var(--u)*.3)}
.cr{display:grid;grid-template-columns:calc(var(--u)*11) minmax(0,1fr) calc(var(--u)*20) minmax(0,1fr) calc(var(--u)*11);align-items:center;gap:calc(var(--u)*1.2);min-height:calc(var(--u)*3)}
.cr .v{font:900 calc(var(--u)*3)/1 var(--disp);font-variant-numeric:tabular-nums}
.cr .v.a{text-align:right}
.cr .k{text-align:center;color:var(--mute);font:600 calc(var(--u)*2.5)/1 var(--text)}
.cr .bar{height:calc(var(--u)*1.5);background:rgba(255,255,255,.1);display:flex}
.cr .bar.l{justify-content:flex-end}
.cr .bar i{display:block;height:100%}
.cr .bar.l i{background:var(--ca-hi)}
.cr .bar.r i{background:var(--cb-hi)}
.cr.hd .t{font:900 calc(var(--u)*3.4)/1 var(--disp);display:flex;align-items:center;gap:calc(var(--u)*1)}
.cr.hd .t.a{justify-content:flex-end;grid-column:1/3}
.cr.hd .t.h{grid-column:4/6}
.cr.hd .t i{display:inline-block;width:calc(var(--u)*.8);height:calc(var(--u)*2.6)}

.lr{display:grid;grid-template-columns:minmax(0,1fr) calc(var(--u)*14) minmax(0,1fr);gap:calc(var(--u)*1.6);align-items:center;min-height:calc(var(--u)*4.2);font:600 calc(var(--u)*2.8)/1.1 var(--text);border-top:1px solid rgba(255,255,255,.1)}
.lr.hd{border-top:0;font:900 calc(var(--u)*3.4)/1 var(--disp);min-height:calc(var(--u)*3.2)}
.lr .a{text-align:right}.lr .h{text-align:left}
.lr b{font:900 calc(var(--u)*3.8)/1 var(--disp);margin-right:calc(var(--u)*.5)}
.lr .k{text-align:center;color:var(--mute);font:700 calc(var(--u)*2.4)/1 var(--text)}
table.ls.wide{font-size:calc(var(--u)*var(--s-ls)*.82)}
table.ls.wide th,table.ls.wide td{padding-left:calc(var(--u)*.5);padding-right:calc(var(--u)*.5)}
.pl{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:calc(var(--u)*3.2)}
.tb{min-width:0}
.tb table{width:100%;border-collapse:collapse;font:600 calc(var(--u)*2.4)/1.05 var(--text);font-variant-numeric:tabular-nums}
.tb th{color:var(--mute);font-weight:600;text-align:right;padding:calc(var(--u)*.25) calc(var(--u)*.7)}
.tb td{text-align:right;padding:calc(var(--u)*.22) calc(var(--u)*.7);border-top:1px solid rgba(255,255,255,.1);white-space:nowrap}
.tb th:first-child,.tb td:first-child{text-align:left;padding-left:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:calc(var(--u)*28)}
.tb td:first-child{font-weight:700}
.tb td .p{color:var(--mute);font-weight:500;margin-left:calc(var(--u)*.6);font-size:.85em}
.tb tr.g th{font:900 calc(var(--u)*2.6)/1 var(--disp);color:var(--white);padding-top:calc(var(--u)*.55)}
.tb tr.tm th{font:900 calc(var(--u)*3.2)/1 var(--disp);color:var(--white);border-bottom:calc(var(--u)*.35) solid var(--tc);padding:calc(var(--u)*.1) 0 calc(var(--u)*.4);text-align:left}
.tb td.hot{color:#fff;font-weight:800}

.plays{display:flex;flex-direction:column;gap:calc(var(--u)*.55)}
.pr{display:grid;grid-template-columns:calc(var(--u)*12) calc(var(--u)*7.5) minmax(0,1fr) calc(var(--u)*13);align-items:center;gap:calc(var(--u)*1.6);font:600 calc(var(--u)*2.7)/1.1 var(--text);min-height:calc(var(--u)*3.6)}
.pr .w{color:var(--mute)}
.pr .tm{font:900 calc(var(--u)*2.8)/1 var(--disp);padding:calc(var(--u)*.4) 0;text-align:center;background:var(--tc)}
.pr .x{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr .sc{font:900 calc(var(--u)*3.2)/1 var(--disp);text-align:right;font-variant-numeric:tabular-nums}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(calc(var(--u)*30),1fr));gap:calc(var(--u)*2)}
.tile{background:rgba(255,255,255,.07);padding:calc(var(--u)*1.4) calc(var(--u)*1.8);border-left:calc(var(--u)*.5) solid var(--gold);min-width:0}
.tile .k{font:600 calc(var(--u)*2.3)/1.1 var(--text);color:var(--mute)}
.tile .v{font:900 calc(var(--u)*4.6)/1.05 var(--disp);margin-top:calc(var(--u)*.4);overflow:hidden;text-overflow:ellipsis}
.tile .v.sm{font-size:calc(var(--u)*3.2)}
.empty{font:800 calc(var(--u)*4)/1 var(--disp);color:var(--mute);padding-top:calc(var(--u)*6);text-align:center}

/* ---- other games ---- */
.strip{display:flex;align-items:stretch;gap:calc(var(--u)*1);height:calc(var(--u)*6.6);min-width:0}
.chips{display:flex;gap:calc(var(--u)*1);flex:1;min-width:0;overflow:hidden}
.chip{flex:0 0 calc(var(--u)*36);display:flex;align-items:center;gap:calc(var(--u)*1.1);padding:0 calc(var(--u)*1.6);border:0;color:var(--white);cursor:pointer;
  background:var(--plate2);font:900 calc(var(--u)*3)/1 var(--disp);white-space:nowrap;text-align:left;
  clip-path:polygon(0 0,100% 0,100% calc(100% - var(--u)*1.2),calc(100% - var(--u)*1.2) 100%,0 100%)}
.chip.on{background:rgba(255,255,255,.26)}
.chip:focus-visible{outline:calc(var(--u)*.35) solid var(--gold);outline-offset:calc(var(--u)*-.35)}
.chip i{width:calc(var(--u)*.6);height:calc(var(--u)*3.2);flex:none}
.chip .n{font-variant-numeric:tabular-nums}
.chip .s{margin-left:auto;font:600 calc(var(--u)*2.2)/1 var(--text);color:var(--mute)}
.chip .s.lv{color:#fff}
.chip .s.lv::before{content:"";display:inline-block;width:calc(var(--u)*.9);height:calc(var(--u)*.9);border-radius:50%;background:var(--live);margin-right:calc(var(--u)*.6)}
.count{align-self:center;color:var(--mute);font:600 calc(var(--u)*2.2)/1 var(--text);padding-left:calc(var(--u)*1)}

.wipe{position:fixed;top:0;left:-130vw;width:130vw;height:100%;z-index:20;pointer-events:none;display:none;
  background:linear-gradient(to right,var(--board) 0 97%,#fff 97% 100%);transform:skewX(-14deg)}
.wipe.go{display:block;animation:sweep .7s cubic-bezier(.6,0,.4,1) both}
#dim{position:fixed;inset:0;pointer-events:none;background:#000;opacity:0;z-index:30}

/* ---- controls (appear on mouse move) ---- */
#hud{position:fixed;left:50%;bottom:16px;z-index:40;display:flex;flex-direction:column;gap:8px;box-sizing:border-box;max-width:calc(100vw - 32px);padding:10px 12px;
  background:rgba(5,8,18,.94);border:1px solid #2a3350;font:600 13px/1 var(--text);
  opacity:0;pointer-events:none;transform:translate(-50%,24px);transition:opacity .25s ease,transform .25s ease}
body.ui #hud{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
#hud .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center}
#hud button,#hud select{color:var(--white);background:#10162a;border:1px solid #2a3350;padding:8px 12px;cursor:pointer;font-weight:700;letter-spacing:.03em}
#hud button[aria-pressed="true"]{background:var(--white);border-color:var(--white);color:#0a0e1a}
#hud label{display:flex;gap:6px;align-items:center;color:var(--mute)}
#hud input[type=range]{width:90px;accent-color:#ffc61a}
#hud :focus-visible{outline:2px solid #ffc61a;outline-offset:2px}

@keyframes blink{50%{opacity:.25}}
@keyframes pop{50%{color:var(--gold)}}
@keyframes rise{0%{opacity:0;transform:skewX(6deg) translateY(30%) scale(.6)}15%{opacity:1;transform:skewX(6deg) translateY(0) scale(1.15)}30%{transform:skewX(6deg) scale(1)}80%{opacity:1}100%{opacity:0;transform:skewX(6deg) translateY(-25%)}}
@keyframes fill{to{transform:scaleX(1)}}
@keyframes sweep{to{transform:translateX(260vw) skewX(-14deg)}}
@media (prefers-reduced-motion:reduce){.live i,.side.pop .score,.delta{animation:none}.wipe{display:none!important}.slabbody{transition:none}#hud{transition:none}}

/* ---- squarer screens (4:3, 5:4, 1:1): the extra height goes to the scoreboard, not to empty space ---- */
@media (max-aspect-ratio:3/2) and (min-aspect-ratio:9/10){
  :root{--s-score:46;--s-nick:11.5;--s-city:3.9;--s-rec:3.6;--s-time:18;--s-per:4}
  .hero{grid-template-columns:minmax(0,1fr) minmax(calc(var(--u)*40),calc(var(--u)*46)) minmax(0,1fr)}
}
/* ---- portrait / phone: stack the two teams with the clock plate between them ---- */
@media (max-aspect-ratio:9/10){
  :root{--u:calc(100vw / 54);--s-score:15;--s-nick:6;--s-city:2.6;--s-rec:2.6;--s-time:10;--s-per:3;--s-ls:2.8;--s-ctx:3.2;--slab:58}
  body{overflow-y:auto;overflow-x:hidden}
  .stage{height:auto;min-height:100%;grid-template-rows:auto auto auto auto;padding:calc(var(--u)*1.2) calc(var(--u)*1.6)}
  .top{flex-wrap:wrap;gap:calc(var(--u)*1)}
  .where{flex-basis:100%;order:5;font-size:calc(var(--u)*2.8)}
  .clk{margin-left:auto}
  .hero{grid-template-columns:1fr;gap:calc(var(--u)*1.2)}
  .side{flex-direction:row;flex-wrap:wrap;justify-content:space-between;text-align:left;padding:calc(var(--u)*1.2) calc(var(--u)*1.6);min-height:calc(var(--u)*13)}
  .side>*{transform:none}
  .side.a{order:1}.plate{order:2}.side.h{order:3}
  .side .tx{display:flex;flex-direction:column;align-items:flex-start;min-width:0;flex:1}
  .score{margin-top:0}
  .delta{left:auto;right:100%}
  .fa{clip-path:polygon(0 0,100% 0,100% 44%,0 56%)}
  .fb{clip-path:polygon(0 56%,100% 44%,100% 100%,0 100%)}
  .seam{clip-path:polygon(0 55.7%,100% 43.7%,100% 44.3%,0 56.3%)}
  .cr{grid-template-columns:calc(var(--u)*7) minmax(0,1fr) calc(var(--u)*14) minmax(0,1fr) calc(var(--u)*7);gap:calc(var(--u)*.8)}
  .cr .k{font-size:calc(var(--u)*2.3)}
  .pl{grid-template-columns:1fr;gap:calc(var(--u)*2)}
  .pr{grid-template-columns:calc(var(--u)*10) calc(var(--u)*6.5) minmax(0,1fr) calc(var(--u)*9)}
  .slab{height:auto;min-height:calc(var(--u)*30)}
  .chip{flex-basis:calc(var(--u)*30)}
  #bFs{display:none}
}
</style>

  var ot=p-lg.reg; if(ot>0) return ot===1?'OVERTIME':ord(ot).toUpperCase()+' OVERTIME';

function periodShort(lg,p){

function timeOf(t){ return clean(new Date(t).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})).toUpperCase(); }
function dayOf(t){

function statusOf(e,c,lg){
  var st=e.status||c.status||{}, ty=st.type||{}, state=ty.state||'pre', nm=ty.name||'', det=clean(ty.shortDetail||ty.detail||''),
      p=st.period||0, clk=clean(st.displayClock||''), t=Date.parse(e.date), o={state:state,big:'',small:'',off:false,period:p};
  if(/POSTPONED|CANCELED|CANCELLED|FORFEIT/.test(nm)){ o.off=true; o.state='pre'; o.big=clean(ty.description||det||'Postponed').toUpperCase(); }

}
function statList(arr){

    venue:clean(v.fullName),city:clean([ad.city,ad.state].filter(Boolean).join(', ')),tv:tv.join(', '),
    odds:clean(od&&od.details),ou:od&&od.overUnder?String(od.overUnder):'',

      return {clock:clean(d.clock&&d.clock.displayValue),tid:String(d.team&&d.team.id!=null?d.team.id:''),kind:clean(d.type&&d.type.text),

/* ---------- summary endpoint: team stats, player box score, scoring plays ---------- */
function sideOf(t,i,g){
  var id=String(t.team&&t.team.id!=null?t.team.id:'');
  if(id&&id===g.away.tid) return 'away'; if(id&&id===g.home.tid) return 'home';
  if(t.homeAway==='away'||t.homeAway==='home') return t.homeAway;

}
function parseSummary(j,g){

  (bx.players||[]).forEach(function(t,i){
    out.groups[sideOf(t,i,g)]=(t.statistics||[]).map(function(gr){
      return {name:clean(gr.name||gr.type).toLowerCase(),labels:(gr.labels||[]).map(clean),
        rows:(gr.athletes||[]).map(function(a){ var at=a.athlete||{};
          return {name:clean(at.shortName||at.displayName),pos:clean(at.position&&at.position.abbreviation),stats:(a.stats||[]).map(clean)}; })
          .filter(function(r){ return r.stats.length&&r.name; })};
    });

    var tid=String(p.team&&p.team.id!=null?p.team.id:''), ab=(tid===g.away.tid)?g.away.abbr:(tid===g.home.tid)?g.home.abbr:clean(p.team&&p.team.abbreviation).toUpperCase();

      text:clean(p.text||(p.type&&p.type.text)),aw:p.awayScore,hw:p.homeScore});

/* what to show for each sport's team comparison: [label, ESPN stat names, kind] */
var TEAMSTATS={
  bb:[['FG%',['fieldGoalPct'],'n'],['3P%',['threePointFieldGoalPct','threePointPct'],'n'],['FT%',['freeThrowPct'],'n'],['Rebounds',['totalRebounds','rebounds'],'n'],
      ['Assists',['assists'],'n'],['Turnovers',['turnovers','totalTurnovers'],'n'],['Steals',['steals'],'n'],['Blocks',['blocks'],'n'],['Paint points',['pointsInPaint'],'n'],['Fast break',['fastBreakPoints'],'n']],

  ba:[['Hits',['hits'],'n'],['Home runs',['homeRuns'],'n'],['Walks',['walks','baseOnBalls'],'n'],['Strikeouts',['strikeouts'],'n'],['Left on base',['leftOnBase','LOB'],'n'],['Errors',['errors'],'n']],
  sc:[['Possession',['possessionPct'],'n'],['Shots',['totalShots','shots'],'n'],['On target',['shotsOnTarget'],'n'],['Corners',['wonCorners','cornerKicks'],'n'],

function findStat(list,c){
  var i, s;
  for(i=0;i<list.length;i++){ s=list[i]; if(c[1].indexOf(s.name)>=0) return s; }
  for(i=0;i<list.length;i++){ s=list[i]; if(s.label&&s.label.toLowerCase()===c[0].toLowerCase()) return s; }

}
function barVal(v,kind){
  v=String(v);
  if(kind==='time'){ var m=/(\d+):(\d+)/.exec(v); return m?(+m[1])*60+(+m[2]):0; }
  if(kind==='frac'){ var f=/(\d+)\s*[\/-]\s*(\d+)/.exec(v); return f?(+f[2]>0?(+f[1])/(+f[2]):0):num(v); }
  return Math.max(0,num(v));
}

/* what to show in the player box score for each sport */
function pickCols(labels,want){
  var idx=[], cols=[];

  if(!cols.length) labels.slice(0,6).forEach(function(l,i){ idx.push(i); cols.push(l); });

}

      rows=sortBy(gr.rows,function(r){ return yi>=0?num(r.stats[yi]):0; }).slice(0,w[3]);

function teamRows(g){
  var d=sd(g), A=d&&d.stats.away.length?d.stats.away:g.away.stats, H=d&&d.stats.home.length?d.stats.home:g.home.stats;
  if(!A.length||!H.length) return [];

  (TEAMSTATS[g.lg.sport]||[]).forEach(function(c){
    var a=findStat(A,c), h=findStat(H,c);
    if(a&&h) rows.push({label:c[0],a:a.val,h:h.val,av:barVal(a.val,c[2]),hv:barVal(h.val,c[2])});
  });

    rows=[];
    A.slice(0,7).forEach(function(a){
      var h=null; H.forEach(function(x){ if(x.name===a.name) h=x; });
      if(h) rows.push({label:a.label||a.name,a:a.val,h:h.val,av:Math.max(0,num(a.val)),hv:Math.max(0,num(h.val))});
    });

    p[1].forEach(function(l){ if(!map[l.cat]){ map[l.cat]={cat:l.cat}; cats.push(l.cat); } map[l.cat][p[0]]=l; });

    row.appendChild(el('span','sc',p.aw!=null&&p.hw!=null?p.aw+'-'+p.hw:'')); w.appendChild(row);
  });

}
function viewsFor(g){
  if(!g||settings.stats==='off') return [];
  var info={id:'info',title:'Game info',draw:drawInfo};
  if(g.state==='pre'||g.off) return [info];
  var all=[], rows=teamRows(g);
  if(rows.length>=2) all.push({id:'team',title:'Team stats',draw:drawTeam});
  if(boxData(g)) all.push({id:'box',title:g.lg.sport==='bb'?'Box score':'Top performers',draw:drawBox});
  else if(leaderRows(g).length) all.push({id:'box',title:'Game leaders',draw:drawLeaders});
  if(playsOf(g).length) all.push({id:'plays',title:g.lg.sport==='sc'?'Goals and cards':'Scoring summary',draw:drawPlays});
  if(!all.length) return infoCount(g)>=2?[info]:[];
  if(settings.stats!=='auto'){ var only=all.filter(function(v){ return v.id===settings.stats; }); if(only.length) return only; }
  return all;
}

/* =========================================================
   Drawing the scoreboard itself
   ========================================================= */
function setColors(g){
  var s=root.style, c=g.col;
  s.setProperty('--ca',c.a); s.setProperty('--ca-hi',c.ahi); s.setProperty('--ca-lo',c.alo);
  s.setProperty('--cb',c.b); s.setProperty('--cb-hi',c.bhi); s.setProperty('--cb-lo',c.blo);
  var f=$('field'), done=g.state==='post'&&!g.off&&g.away.score!=null;
  f.className='field'+(done&&g.away.score<g.home.score?' lose-a':'')+(done&&g.home.score<g.away.score?' lose-h':'');
}
function renderTop(g){
  $('lg').textContent=g.lg.label;
  $('venue').textContent=[g.venue,g.city].filter(Boolean).join(', ');
  $('note').textContent=g.note;
  $('liveTag').hidden=g.state!=='in';
}
function hasBall(g,t){ return g.state==='in'&&g.sit&&g.sit.poss&&(g.sit.poss===t.tid||g.sit.poss===t.abbr); }
function renderSide(elm,g,key){
  var t=key==='a'?g.away:g.home, o=key==='a'?g.home:g.away, f=flash[g.id+':'+key], hot=f&&f.until>Date.now();
  var lose=g.state==='post'&&!g.off&&t.score!=null&&o.score!=null&&o.score>t.score;
  elm.className='side '+key+(hot?' pop':'')+(lose?' lose':'');
  elm.innerHTML='';
  var tx=el('div','tx');
  if(t.city) tx.appendChild(el('div','city',t.city));
  var nick=el('div','nick'); if(hasBall(g,t)) nick.appendChild(el('span','ball'));
  nick.appendChild(document.createTextNode(t.nick));

  tx.appendChild(nick);

  elm.appendChild(tx);

  sc.style.setProperty('--sf',pre?.7:(txt.length>=3?.8:1));
  if(hot&&f.delta>0) sc.appendChild(el('span','delta','+'+f.delta));
  elm.appendChild(sc);
}
function lsLabel(lg,i){
  if(lg.sport==='ba') return String(i+1);
  if(i<lg.reg) return String(i+1);
  var k=i-lg.reg+1; return k===1?'OT':k+'OT';
}
function lineScore(g){
  if(g.state==='pre'||g.off) return null;
  var lg=g.lg, a=g.away, h=g.home, n=Math.max(a.ls.length,h.ls.length), ba=lg.sport==='ba';
  if(!n&&!ba) return null;
  var cols=Math.max(ba?9:lg.reg,n), cur0=g.state==='in'?(g.st.period||0)-1:-1;
  var t=el('table','ls'), hr=el('tr'); hr.appendChild(el('th'));
  for(var i=0;i<cols;i++) hr.appendChild(el('th',i===cur0?'cur':'',lsLabel(lg,i)));
  hr.appendChild(el('th',null,ba?'R':'T')); if(ba&&a.hits!=null){ hr.appendChild(el('th',null,'H')); hr.appendChild(el('th',null,'E')); }
  t.appendChild(hr);
  [[a,g.col.ahi],[h,g.col.bhi]].forEach(function(p){
    var s=p[0], r=el('tr'), nm=el('td'), sw=el('i'); sw.style.setProperty('--tc',p[1]); nm.appendChild(sw); nm.appendChild(document.createTextNode(s.abbr)); r.appendChild(nm);
    for(var i=0;i<cols;i++){ var v=s.ls[i]; r.appendChild(el('td',i===cur0?'cur':(v==null?'dim':''),v==null?'':v)); }
    r.appendChild(el('td','tot',String(s.score==null?'':s.score)));
    if(ba&&s.hits!=null){ r.appendChild(el('td',null,String(s.hits))); r.appendChild(el('td',null,String(s.errors==null?0:s.errors))); }
    t.appendChild(r);
  });
  if(cols+(ba?3:1)>=10) t.className='ls wide';
  return t;
}
function diamond(b){
  var wrap=el('div','dia');
  var svg='<svg viewBox="0 0 100 74" aria-hidden="true"><rect class="base'+(b.b2?' on':'')+'" x="-8" y="-8" width="16" height="16" transform="translate(50 16) rotate(45)"/>'+
    '<rect class="base'+(b.b3?' on':'')+'" x="-8" y="-8" width="16" height="16" transform="translate(20 42) rotate(45)"/>'+
    '<rect class="base'+(b.b1?' on':'')+'" x="-8" y="-8" width="16" height="16" transform="translate(80 42) rotate(45)"/></svg>';
  wrap.innerHTML=svg;
  var cnt=el('div','cnt'); cnt.appendChild(document.createTextNode((b.balls||0)+'-'+(b.strikes||0)));
  var sm=el('small'); for(var i=0;i<3;i++) sm.appendChild(el('span','out'+(i<(b.outs||0)?' on':''))); sm.appendChild(document.createTextNode((b.outs||0)+' out'));
  cnt.appendChild(sm); wrap.appendChild(cnt); return wrap;
}
var KICK={bb:'Tip-off',fb:'Kickoff',hk:'Puck drop',ba:'First pitch',sc:'Kickoff'};
function countdown(g){
  var ms=g.t-Date.now(); if(ms<=0) return 'Starting soon';
  var m=Math.round(ms/60000), h=Math.floor(m/60);
  return (KICK[g.lg.sport]||'Start')+' in '+(h>=24?Math.floor(h/24)+'d '+(h%24)+'h':h>0?h+'h '+(m%60)+'m':m+'m');
}
function renderPlate(g){
  var p=$('plate'), s=g.st;
  p.className='plate'+(g.state==='in'?' lv':''); p.innerHTML='';
  p.appendChild(el('div','per',s.small||' '));
  p.appendChild(el('div','time'+(s.big.length>7?' sm':''),s.big));
  if(g.state==='in'&&g.sit&&g.sit.ba){
    p.appendChild(diamond(g.sit.ba));
    var who=[g.sit.ba.batter?'AB '+g.sit.ba.batter:'',g.sit.ba.pitcher?'P '+g.sit.ba.pitcher:''].filter(Boolean).join('   ');
    if(who) p.appendChild(el('div','ctx',who));
  } else if(g.state==='in'&&g.sit&&g.sit.down){
    var c=el('div','ctx'), m=/^(.*?)\s+at\s+(.*)$/.exec(g.sit.down);
    if(m){ c.appendChild(el('b',null,m[1])); c.appendChild(document.createTextNode(' at '+m[2])); } else c.appendChild(el('b',null,g.sit.down));
    if(g.sit.red) c.appendChild(el('span','rz','RED ZONE'));
    p.appendChild(c);
  } else if(g.state==='in'&&g.sit&&g.sit.play){
    p.appendChild(el('div','ctx play',g.sit.play));
  } else if(g.state==='pre'&&!g.off){
    var cd=el('div','ctx',countdown(g)); cd.id='cd'; p.appendChild(cd);
  }
  var ls=lineScore(g); if(ls) p.appendChild(ls);
}
function renderStrip(){
  var s=$('strip'); s.hidden=!settings.strip; if(!settings.strip) return;
  var box=$('chips'); box.innerHTML='';
  games.forEach(function(g,i){
    var c=el('button','chip'+(i===cur?' on':'')); c.type='button'; c.setAttribute('aria-label',g.away.nick+' at '+g.home.nick);
    var ia=el('i'); ia.style.background=g.col.ahi; var ih=el('i'); ih.style.background=g.col.bhi;
    c.appendChild(ia); c.appendChild(el('span','n',g.away.abbr+(g.away.score==null?'':' '+g.away.score)));
    c.appendChild(ih); c.appendChild(el('span','n',g.home.abbr+(g.home.score==null?'':' '+g.home.score)));
    var st=g.state==='in'?(g.lg.sport==='ba'||g.lg.sport==='sc'?g.st.big:periodShort(g.lg,g.st.period||1)+' '+g.st.big):g.st.big;
    c.appendChild(el('span','s'+(g.state==='in'?' lv':''),st));
    c.addEventListener('click',function(){ if(i!==cur) go(i); });
    box.appendChild(c);
  });
  var kids=box.children;
  if(kids.length){
    var cw=kids[0].offsetWidth||1, gap=parseFloat(getComputedStyle(box).columnGap)||0, cap=Math.max(1,Math.floor((box.clientWidth+gap)/(cw+gap))), pg=Math.floor(cur/cap);
    for(var k=0;k<kids.length;k++) kids[k].hidden=Math.floor(k/cap)!==pg;
  }
  $('count').textContent=games.length?(cur+1)+' of '+games.length:'';
}
function sigOf(g){
  var f=function(k){ var x=flash[g.id+':'+k]; return x&&x.until>Date.now()?x.until:0; };
  return [g.id,g.state,g.st.big,g.st.small,g.away.score,g.home.score,g.away.ls.join(),g.home.ls.join(),g.sit?JSON.stringify(g.sit):'',f('a'),f('h'),g.away.hits,g.home.hits].join('|');
}
function fitEl(e,avail){
  if(!e) return; e.style.fontSize='';
  var w=e.scrollWidth; if(avail>0&&w>avail+1) e.style.fontSize=(parseFloat(getComputedStyle(e).fontSize)*avail/w*.98)+'px';
}
function refit(){
  var p=$('plate'), t=p.querySelector('.time'), cs=getComputedStyle(p);
  if(t) fitEl(t,p.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight));
  ['sa','sh'].forEach(function(id){
    var s=$(id), n=s.querySelector('.nick'), sc=s.querySelector('.score'), tx=s.querySelector('.tx');
    var port=window.innerWidth/window.innerHeight<.9, avail=port?s.clientWidth*.55:s.clientWidth;
    if(n) fitEl(n,avail); if(sc&&!port) fitEl(sc,s.clientWidth);
  });
}
function renderHero(g,force){
  var sg=sigOf(g); if(!force&&sg===heroSig) return; heroSig=sg;
  setColors(g); renderTop(g); renderSide($('sa'),g,'a'); renderSide($('sh'),g,'h'); renderPlate(g); refit();
}
function renderEmpty(){
  heroSig=''; $('lg').textContent=''; $('venue').textContent=''; $('note').textContent=''; $('liveTag').hidden=true;
  $('sa').innerHTML=''; $('sh').innerHTML=''; $('sa').className='side a'; $('sh').className='side h';
  var p=$('plate'); p.className='plate'; p.innerHTML=''; p.appendChild(el('div','per',loaded?'Right now':'Loading'));
  p.appendChild(el('div','time sm',loaded?'NO GAMES':'SCORES')); stage.classList.add('nostats'); $('chips').innerHTML=''; $('count').textContent=''; $('vd').innerHTML='';
}

/* ---------- stat slab: one view at a time ---------- */
function restartProgress(){
  var pr=$('prog'); pr.className=''; void pr.offsetWidth;
  pr.style.animationDuration=settings.hold+'s'; pr.style.animationPlayState=paused?'paused':'running'; pr.className='run';
}
function drawView(fade,keepProgress){
  var g=games[cur]; if(!g) return;
  var vs=viewsFor(g);
  if(!vs.length){ stage.classList.add('nostats'); return; }
  stage.classList.remove('nostats');
  if(viewIdx>=vs.length) viewIdx=vs.length-1;
  var v=vs[viewIdx], sb=$('sb');
  function fill(){
    sb.innerHTML=''; v.draw(g,sb); sb.classList.remove('out');
    $('vt').textContent=v.title;
    var d=$('vd'); d.innerHTML=''; if(vs.length>1) vs.forEach(function(x,i){ d.appendChild(el('i',i===viewIdx?'on':'')); });
    if(!keepProgress) restartProgress();
  }
  clearTimeout(fillTimer);
  if(fade&&!reduce){ sb.classList.add('out'); fillTimer=setTimeout(fill,220); } else fill();
}
function refreshViews(){
  var g=games[cur]; if(!g) return;
  var prev=$('vt').textContent, vs=viewsFor(g), i;
  for(i=0;i<vs.length;i++) if(vs[i].title===prev){ viewIdx=i; break; }
  drawView(false,true);
}

/* ---------- moving between games and views ---------- */
function go(i,quiet){
  var tok=++goToken;
  function apply(){
    if(tok!==goToken||!games[i]) return;
    cur=i; viewIdx=0; var g=games[cur];
    renderHero(g,true); renderStrip(); drawView(false); wantSummary(g); lastSwitch=Date.now();
  }
  if(quiet||reduce||!games.length||games.length<2&&cur===i){ apply(); return; }
  var w=$('wipe'); w.classList.remove('go'); void w.offsetWidth; w.classList.add('go');
  setTimeout(apply,310); setTimeout(function(){ if(tok===goToken) w.classList.remove('go'); },780);
}
function step(d){
  if(games.length<2){ viewIdx=0; drawView(true); lastSwitch=Date.now(); return; }
  go((cur+d+games.length)%games.length);
}
function advance(){
  var g=games[cur]; if(!g) return;
  var vs=viewsFor(g);
  if(viewIdx+1<vs.length){ viewIdx++; drawView(true); lastSwitch=Date.now(); } else step(1);
}

/* =========================================================
   Feeds
   ========================================================= */
function getJSON(url){
  var ctl=window.AbortController?new AbortController():null, to=setTimeout(function(){ if(ctl) ctl.abort(); },9000);
  return fetch(url,{cache:'no-store',signal:ctl?ctl.signal:undefined}).then(function(r){
    clearTimeout(to); if(!r.ok) throw new Error('http '+r.status); return r.json();
  },function(e){ clearTimeout(to); throw e; });
}
function loadLeague(lg){
  return getJSON(BASE+lg.path+'/scoreboard').then(function(j){ return (j.events||[]).map(function(e){ return norm(e,lg); }).filter(Boolean); });
}
function wantSummary(g){
  if(!g||demo||g.state==='pre'||g.off||g.id.indexOf('demo:')===0) return;
  var s=sum[g.id], ttl=g.state==='in'?15000:600000;
  if(s&&Date.now()-s.t<ttl) return; if(sumBusy[g.id]) return; sumBusy[g.id]=1;
  getJSON(BASE+g.lg.path+'/summary?event='+g.eid).then(function(j){
    sum[g.id]={t:Date.now(),d:parseSummary(j,g)};
  }).catch(function(){
    sum[g.id]={t:Date.now()-ttl+30000,d:s&&s.d||null};
  }).then(function(){
    sumBusy[g.id]=0; if(games[cur]&&games[cur].id===g.id) refreshViews();
  });
}
function setGames(list){
  var now=Date.now(), jump=null;
  list.forEach(function(g){
    var p=lastScores[g.id], s=[g.away.score,g.home.score];
    if(p&&g.state==='in') ['a','h'].forEach(function(k,i){
      if(s[i]!=null&&p[i]!=null&&s[i]>p[i]){ flash[g.id+':'+k]={until:now+6000,delta:s[i]-p[i]}; jump=g.id; }
    });
    lastScores[g.id]=s;
  });
  var curId=games[cur]&&games[cur].id, wasEmpty=!games.length;
  games=list;
  if(!games.length){ cur=0; renderEmpty(); return; }
  var idx=-1; games.forEach(function(g,i){ if(g.id===curId) idx=i; });
  if(idx<0||wasEmpty){ go(0,true); return; }
  cur=idx; var g=games[cur];
  var jumpIdx=-1; if(jump) games.forEach(function(x,i){ if(x.id===jump) jumpIdx=i; });
  if(jumpIdx>=0&&jumpIdx!==cur){ holdUntil=now+10000; go(jumpIdx); return; }
  if(jumpIdx>=0) holdUntil=now+10000;
  renderHero(g,false); renderStrip(); refreshViews(); wantSummary(g);
}
function setTag(){
  var t=$('tag'); t.hidden=!(demo||offline); t.className='tag'+(demo?'':' off'); t.textContent=demo?'DEMO DATA':'OFFLINE';
}
function apply(){
  var list=[];
  if(demo) list=demoList; else settings.leagues.forEach(function(id){ if(cache[id]) list=list.concat(cache[id]); });
  setTag(); setGames(sortGames(list));
}
function startDemo(){
  demo=true; if(!demoList.length) demoList=demoGames();
  if(demoTimer) return;
  demoTimer=setInterval(function(){
    var live=demoList.filter(function(g){ return g.state==='in'&&g.lg.sport!=='ba'; }); if(!live.length) return;
    var g=live[Math.floor(Math.random()*live.length)], t=Math.random()<.5?g.away:g.home, sp=g.lg.sport;
    t.score+=sp==='fb'?(Math.random()<.5?7:3):(sp==='hk'||sp==='sc'?1:(Math.random()<.5?2:3));
    if(t.ls.length) t.ls[t.ls.length-1]=String((+t.ls[t.ls.length-1]||0)+(sp==='fb'?7:sp==='hk'||sp==='sc'?1:2));
    apply();
  },17000);
}
function refresh(){
  clearTimeout(retry);
  if(forceDemo){ startDemo(); loaded=true; apply(); return; }
  var en=settings.leagues.map(function(id){ return BY[id]; }), ok=0;
  Promise.all(en.map(function(lg){
    return loadLeague(lg).then(function(list){ cache[lg.id]=list; ok++; },function(){});
  })).then(function(){
    loaded=true;
    if(ok>0||!en.length){ hasReal=true; offline=false; demo=false; if(demoTimer){ clearInterval(demoTimer); demoTimer=null; } }
    else if(hasReal) offline=true; else startDemo();
    apply();
    retry=setTimeout(refresh,demo?60000:(games.some(function(g){ return g.state==='in'; })?10000:60000));
  });
}

/* =========================================================
   Controls, timers
   ========================================================= */
function drawLeagueChips(){
  var c=$('lgs'); c.innerHTML='';
  LEAGUES.forEach(function(l){
    var b=el('button',null,l.label); b.type='button'; b.setAttribute('aria-pressed',settings.leagues.indexOf(l.id)>=0?'true':'false');
    b.addEventListener('click',function(){
      var i=settings.leagues.indexOf(l.id); if(i>=0) settings.leagues.splice(i,1); else settings.leagues.push(l.id);
      save(); drawLeagueChips(); refresh();
    });
    c.appendChild(b);
  });
}
function syncControls(){
  $('selStats').value=settings.stats; $('selHold').value=String(settings.hold);
  if(!$('selHold').value){ var o=el('option',null,settings.hold+'s'); o.value=String(settings.hold); $('selHold').appendChild(o); $('selHold').value=String(settings.hold); }
  $('bStrip').setAttribute('aria-pressed',settings.strip?'true':'false');
  $('bPause').setAttribute('aria-pressed',paused?'true':'false'); $('bPause').textContent=paused?'Resume':'Pause';
  $('rngBright').value=settings.bright; $('dim').style.opacity=((100-settings.bright)/100*.9).toFixed(2);
}
$('selStats').addEventListener('change',function(){ settings.stats=this.value; save(); viewIdx=0; drawView(false); });
$('selHold').addEventListener('change',function(){ settings.hold=parseInt(this.value,10)||8; save(); lastSwitch=Date.now(); restartProgress(); });
$('bStrip').addEventListener('click',function(){ settings.strip=!settings.strip; save(); syncControls(); renderStrip(); });
$('rngBright').addEventListener('input',function(){ settings.bright=parseInt(this.value,10)||100; save(); syncControls(); });
$('bPrev').addEventListener('click',function(){ step(-1); });
$('bNext').addEventListener('click',function(){ step(1); });
$('bPause').addEventListener('click',function(){ paused=!paused; lastSwitch=Date.now(); syncControls(); $('prog').style.animationPlayState=paused?'paused':'running'; });
function fullscreen(){
  var d=document, e=d.documentElement;
  try{ if(d.fullscreenElement||d.webkitFullscreenElement) (d.exitFullscreen||d.webkitExitFullscreen).call(d);
       else { var p=(e.requestFullscreen||e.webkitRequestFullscreen).call(e); if(p&&p.catch) p.catch(function(){}); } }catch(x){}
}
$('bFs').addEventListener('click',fullscreen);
document.addEventListener('keydown',function(ev){
  if(ev.target&&(ev.target.tagName==='SELECT'||ev.target.tagName==='INPUT')) return;
  if(ev.key==='ArrowRight') step(1); else if(ev.key==='ArrowLeft') step(-1);
  else if(ev.key==='f'||ev.key==='F') fullscreen();
  else if(ev.key===' '&&!(ev.target&&ev.target.tagName==='BUTTON')){ ev.preventDefault(); $('bPause').click(); }
});
var idleT=null;
function wakeUI(){
  document.body.classList.add('ui'); document.body.classList.remove('idle'); clearTimeout(idleT);
  idleT=setTimeout(function(){ if(!$('hud').contains(document.activeElement)){ document.body.classList.remove('ui'); document.body.classList.add('idle'); } },3500);
}
['mousemove','pointerdown','touchstart','keydown'].forEach(function(t){ window.addEventListener(t,wakeUI,{passive:true}); });
function wake(){ try{ if(navigator.wakeLock&&document.visibilityState==='visible') navigator.wakeLock.request('screen').catch(function(){}); }catch(e){} }
document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='visible'){ wake(); refresh(); } });
var rz=null; window.addEventListener('resize',function(){ clearTimeout(rz); rz=setTimeout(function(){ renderStrip(); refit(); },150); });
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(function(){ refit(); renderStrip(); });

function clock(){ $('clk').textContent=clean(new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})); }
setInterval(function(){
  var now=Date.now(), g=games[cur];
  clock();
  if(g&&g.state==='pre'&&$('cd')) $('cd').textContent=countdown(g);
  if(g&&g.state==='in') wantSummary(g);
  if(paused||now<holdUntil||!g) return;
  if(now-lastSwitch>=settings.hold*1000) advance();
},1000);

drawLeagueChips(); syncControls(); clock(); wake(); renderEmpty(); refresh();
if(window.__JUMBO_TEST) window.__JUMBO_TEST.api={
  go:function(i){ go(i,true); }, games:function(){ return games; }, cur:function(){ return cur; },
  views:function(){ return viewsFor(games[cur]).map(function(v){ return v.id; }); },
  view:function(id){ var vs=viewsFor(games[cur]); for(var i=0;i<vs.length;i++) if(vs[i].id===id){ viewIdx=i; drawView(false,true); return true; } return false; },
  pause:function(){ paused=true; }, norm:norm, parseSummary:parseSummary, sum:function(){ return sum; }
};
})();
